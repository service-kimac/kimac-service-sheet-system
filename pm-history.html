<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1c36">
<link rel="manifest" href="manifest.json">
<title>PM History - KIMAC</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100vh;font-family:'Sarabun',sans-serif;
  background:#f0f4f8;font-size:13px;overflow-x:hidden;}
body{padding:calc(58px + env(safe-area-inset-top)) 0 calc(72px + env(safe-area-inset-bottom)) 0;}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:300;
  background:linear-gradient(135deg,#0b4f6c 0%,#0e7490 100%);
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  box-shadow:0 2px 12px rgba(0,0,0,.25);}
.tc-l{display:flex;align-items:center;gap:8px;}
.tc-title{color:#fff;font-size:14px;font-weight:800;letter-spacing:1px;}
.tc-r{display:flex;align-items:center;gap:6px;}
.btn-bk{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  color:#fff;padding:5px 10px;border-radius:8px;font-family:'Sarabun',sans-serif;
  font-size:12px;font-weight:600;cursor:pointer;appearance:none;}

/* ACTION BAR */
.actbar{position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(180deg,#073a5a,#032033);
  border-top:1px solid rgba(0,0,0,.25);
  display:flex;gap:8px;padding:9px 12px;
  padding-bottom:calc(9px + env(safe-area-inset-bottom));
  z-index:300;}
.ab{flex:1;padding:10px 4px;border:none;border-radius:10px;
  font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;color:#fff;appearance:none;}
.ab-new{background:linear-gradient(135deg,#0e7490,#0b4f6c);}
.ab-logout{background:rgba(255,255,255,.1);}

/* CONTENT */
.page{max-width:800px;margin:0 auto;padding:12px 10px;}

/* STATS */
.stats-row{display:flex;gap:8px;margin-bottom:10px;}
.stat-card{flex:1;background:#fff;border-radius:10px;padding:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.05);text-align:center;}
.stat-num{font-size:22px;font-weight:800;color:#0e7490;}
.stat-label{font-size:11px;color:#6b7280;margin-top:2px;}

/* FILTER */
.filter-bar{background:#fff;border-radius:10px;padding:10px 12px;
  margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.05);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.filter-bar input,.filter-bar select{
  border:1px solid #d1d5db;border-radius:8px;padding:7px 10px;
  font-family:'Sarabun',sans-serif;font-size:12px;outline:none;
  background:#f9fafb;color:#111;}
.filter-bar input:focus,.filter-bar select:focus{border-color:#0e7490;}
.filter-bar input{flex:1;min-width:150px;}

/* JOB CARD */
.job-card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);
  margin-bottom:8px;overflow:hidden;cursor:pointer;transition:box-shadow .15s;}
.job-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);}
.job-card-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #f3f4f6;}
.job-title{font-size:13px;font-weight:700;color:#111;}
.job-sub{font-size:11px;color:#6b7280;margin-top:2px;}
.badge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;}
.badge.completed{background:#dcfce7;color:#15803d;}
.badge.draft{background:#fef9c3;color:#a16207;}
.job-card-body{padding:8px 14px;display:flex;flex-wrap:wrap;gap:12px;}
.job-info{font-size:11px;color:#6b7280;}
.job-info strong{color:#374151;}
.machine-tags{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 10px;}
.mtag{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;
  background:#e0f2fe;color:#0369a1;}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:#9ca3af;}
.empty .ic{font-size:40px;margin-bottom:8px;}

/* TOAST */
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);
  padding:10px 20px;border-radius:10px;font-family:'Sarabun',sans-serif;
  font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:opacity .3s;
  white-space:nowrap;pointer-events:none;}
.toast.ok{background:#16a34a;color:#fff;}
.toast.err{background:#dc2626;color:#fff;}
.toast.info{background:#0e7490;color:#fff;}

/* DEL MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;
  display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:320px;width:100%;text-align:center;}
.modal h3{font-size:16px;font-weight:700;color:#111;margin-bottom:8px;}
.modal p{font-size:13px;color:#6b7280;margin-bottom:16px;}
.modal-btns{display:flex;gap:8px;}
.modal-btn{flex:1;padding:10px;border:none;border-radius:10px;
  font-family:'Sarabun',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.modal-btn.cancel{background:#f3f4f6;color:#374151;}
.modal-btn.danger{background:#dc2626;color:#fff;}

@media(max-width:480px){
  .stats-row{gap:6px;}
  .stat-num{font-size:18px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tc-l">
    <span class="tc-title">📋 PM HISTORY - KIMAC</span>
  </div>
  <div class="tc-r">
    <span id="userBadge" style="color:rgba(255,255,255,.7);font-size:11px;"></span>
    <button class="btn-bk" onclick="doLogout()">ออกจากระบบ</button>
  </div>
</div>

<div class="page">

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="sTot">-</div>
      <div class="stat-label">ใบ PM ทั้งหมด</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="sDraft" style="color:#d97706;">-</div>
      <div class="stat-label">กำลังดำเนินการ</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="sDone" style="color:#16a34a;">-</div>
      <div class="stat-label">เสร็จสิ้น</div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <input type="text" id="srch" placeholder="🔍 ค้นหาบริษัท / ช่าง..." oninput="renderJobs()">
    <select id="fltStatus" onchange="renderJobs()">
      <option value="">ทุกสถานะ</option>
      <option value="draft">กำลังดำเนินการ</option>
      <option value="completed">เสร็จสิ้น</option>
    </select>
    <select id="fltType" onchange="renderJobs()">
      <option value="">ทุกประเภทเครื่อง</option>
      <option value="eztag">EZtag</option>
      <option value="ezlabe">EZlabe</option>
      <option value="ezfeed">EZfeed</option>
      <option value="ezjet">EZjet</option>
      <option value="ezlaser">EZlaser</option>
    </select>
  </div>

  <!-- Job List -->
  <div id="jobList"><div class="empty"><div class="ic">⏳</div>กำลังโหลด...</div></div>

</div>

<!-- ACTION BAR -->
<div class="actbar">
  <button class="ab ab-new" onclick="newPM()">➕ สร้างใบ PM ใหม่</button>
  <button class="ab ab-logout" onclick="doLogout()">🚪 ออกจากระบบ</button>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="delModal">
  <div class="modal">
    <h3>⚠️ ลบใบ PM</h3>
    <p id="delMsg">คุณต้องการลบใบ PM นี้ใช่ไหม?</p>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeDel()">ยกเลิก</button>
      <button class="modal-btn danger" onclick="doDel()">ลบ</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toastEl"></div>

<script>
var SUPA_URL='',SUPA_KEY='',sb=null,CU=null,CP=null,allJobs=[];
(function(){
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  s.onload=function(){init();};
  document.head.appendChild(s);
})();

async function init(){
  try{
    var sp=document.createElement('script');
    sp.src='../kimac-service-sheet-system/supabase-config.js';
    document.head.appendChild(sp);
    await new Promise(r=>setTimeout(r,300));
    if(typeof SUPABASE_URL!=='undefined') SUPA_URL=SUPABASE_URL;
    if(typeof SUPABASE_ANON_KEY!=='undefined') SUPA_KEY=SUPABASE_ANON_KEY;
  }catch(e){}
  if(!SUPA_URL||!SUPA_KEY){
    document.getElementById('jobList').innerHTML='<div class="empty"><div class="ic">⚠️</div>ไม่พบการตั้งค่า Supabase<br><small>กรุณาตั้งค่า supabase-config.js</small></div>';
    return;
  }
  sb=supabase.createClient(SUPA_URL,SUPA_KEY);
  var sess=await sb.auth.getSession();
  if(!sess.data.session){location.href='login.html';return;}
  CU=sess.data.session.user;
  var{data:p}=await sb.from('profiles').select('*').eq('id',CU.id).single();
  CP=p||{};
  document.getElementById('userBadge').textContent=CP.full_name||CU.email||'';
  await loadJobs();
}

async function loadJobs(){
  var{data,error}=await sb.from('pm_sheets').select('*').order('updated_at',{ascending:false});
  if(error){toastF('โหลดข้อมูลไม่สำเร็จ','err');return;}
  allJobs=data||[];
  updateStats();
  renderJobs();
}

function updateStats(){
  document.getElementById('sTot').textContent=allJobs.length;
  document.getElementById('sDraft').textContent=allJobs.filter(j=>j.status==='draft').length;
  document.getElementById('sDone').textContent=allJobs.filter(j=>j.status==='completed').length;
}

function renderJobs(){
  var q=(document.getElementById('srch').value||'').toLowerCase();
  var st=document.getElementById('fltStatus').value;
  var tp=document.getElementById('fltType').value;
  var jj=allJobs.filter(function(j){
    if(st&&j.status!==st)return false;
    if(tp&&(!j.machine_types||!j.machine_types.includes(tp)))return false;
    if(q){
      var s=(j.company||'')+' '+(j.technician_name||'')+' '+(j.contact||'');
      if(!s.toLowerCase().includes(q))return false;
    }
    return true;
  });
  var cont=document.getElementById('jobList');
  if(!jj.length){
    cont.innerHTML='<div class="empty"><div class="ic">📋</div>ไม่พบใบ PM</div>';
    return;
  }
  var mLabels={eztag:'EZtag',ezlabe:'EZlabe',ezfeed:'EZfeed',ezjet:'EZjet',ezlaser:'EZlaser'};
  cont.innerHTML=jj.map(function(j){
    var date=j.pm_date?new Date(j.pm_date).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'ไม่ระบุวันที่';
    var badge=j.status==='completed'?'<span class="badge completed">✅ เสร็จสิ้น</span>':'<span class="badge draft">📝 ดำเนินการ</span>';
    var mtags=(j.machine_types||[]).map(function(t){return '<span class="mtag">'+mLabels[t]+'</span>';}).join('');
    return '<div class="job-card" onclick="openPM(\''+j.id+'\',event)">'
      +'<div class="job-card-header">'
      +'<div><div class="job-title">'+(j.company||'ไม่ระบุบริษัท')+'</div>'
      +'<div class="job-sub">'+date+' | ช่าง: '+(j.tech_name||j.technician_name||'-')+'</div></div>'
      +badge+'</div>'
      +'<div class="job-card-body">'
      +'<div class="job-info"><strong>ครั้งที่</strong> '+(j.pm_round||1)+'</div>'
      +'<div class="job-info"><strong>ติดต่อ</strong> '+(j.contact||'-')+'</div>'
      +'<div class="job-info"><strong>คะแนน</strong> '+ratingTxt(j.rating)+'</div>'
      +'</div>'
      +(mtags?'<div class="machine-tags">'+mtags+'</div>':'')
      +'<div style="display:flex;gap:6px;padding:0 14px 10px;">'
      +'<button onclick="deletePM(\''+j.id+'\',\''+escA(j.company||\'\')+'\',event)" style="padding:4px 10px;border:1px solid #fca5a5;background:#fff5f5;color:#dc2626;border-radius:6px;font-family:Sarabun,sans-serif;font-size:11px;font-weight:600;cursor:pointer;">🗑 ลบ</button>'
      +'</div>'
      +'</div>';
  }).join('');
}

function ratingTxt(r){
  var m={excellent:'😊 ดีมาก',good:'🙂 ดี',fair:'😐 พอใช้',poor:'😞 ปรับปรุง'};
  return r&&m[r]?m[r]:'-';
}
function escA(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

function openPM(id,e){
  if(e&&e.target&&e.target.tagName==='BUTTON')return;
  localStorage.setItem('kpmid',id);
  location.href='pm-form.html';
}

function newPM(){localStorage.removeItem('kpmid');location.href='pm-form.html';}

var delId=null;
function deletePM(id,company,e){
  if(e){e.stopPropagation();}
  delId=id;
  document.getElementById('delMsg').textContent='ลบใบ PM ของ "'+(company||'ไม่ระบุ')+'" ใช่ไหม?';
  document.getElementById('delModal').classList.add('open');
}
function closeDel(){delId=null;document.getElementById('delModal').classList.remove('open');}
async function doDel(){
  if(!delId)return;
  var{error}=await sb.from('pm_sheets').delete().eq('id',delId);
  closeDel();
  if(error){toastF('ลบไม่สำเร็จ','err');}
  else{toastF('✅ ลบแล้ว','ok');await loadJobs();}
}

async function doLogout(){
  await sb.auth.signOut();
  location.href='login.html';
}

function toastF(m,t){
  var el=document.getElementById('toastEl');
  el.textContent=m;el.className='toast '+(t||'info');
  el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity='0';},3000);
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
